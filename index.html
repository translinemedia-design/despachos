<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órdenes de despacho · Transline</title>
<meta name="theme-color" content="#164B77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despachos TL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2F4; --surface:#FFFFFF; --ink:#0F3456; --muted:#566A80;
  --line:#D3DCE6; --panel:#2981C4; --panel-ink:#FFFFFF; --sun:#66C0DC; --sun-ink:#0F3456;
  --ok:#1E7F55; --warn:#A55B00; --chip:#E6EEF5; --brand:#164B77;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1C2E; --surface:#102A44; --ink:#F4F2F4; --muted:#9DB2C7;
    --line:#22415F; --panel:#66C0DC; --panel-ink:#0A1C2E; --sun:#66C0DC; --sun-ink:#0A1C2E;
    --ok:#4BC487; --warn:#F0A54A; --chip:#163552; --brand:#0D3050; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1C2E; --surface:#102A44; --ink:#F4F2F4; --muted:#9DB2C7;
  --line:#22415F; --panel:#66C0DC; --panel-ink:#0A1C2E; --sun:#66C0DC; --sun-ink:#0A1C2E;
  --ok:#4BC487; --warn:#F0A54A; --chip:#163552; --brand:#0D3050; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff}
.bar{max-width:640px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px}
.logo{height:38px;width:auto;flex:none;display:block}
.brand{padding-left:12px;border-left:1px solid rgba(255,255,255,.3);font-weight:600;font-size:.95rem;line-height:1.15}
.brand small{display:block;font-weight:400;font-size:.72rem;color:#A9D8E8;margin-top:2px}
.sync{margin-left:auto;font-size:.75rem;color:#A9D8E8;text-align:right}
.tabs{max-width:640px;margin:0 auto;display:flex;padding:0 8px}
.tabs button{flex:1;background:none;border:0;color:#A9D8E8;font:inherit;font-weight:600;padding:12px 8px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:#fff;border-color:var(--sun)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--sun);color:var(--sun-ink);font-size:.75rem}
main{max-width:640px;margin:0 auto;padding:16px 16px 140px}
section.view[hidden]{display:none}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-weight:700;font-size:1.05rem;margin-bottom:10px;padding:0}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=search],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-color:var(--panel)}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px;min-height:1.1em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--chip);padding:5px;border-radius:12px}
.seg button{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:9px;padding:12px 6px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--panel-ink);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--panel);background:var(--panel);color:var(--panel-ink)}
.cat{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:320px;overflow:auto;padding:2px}
#cats{margin-top:10px}
#cats button{padding:6px 12px;font-size:.85rem}
.cat button small,.lines small.sku{display:block;font-size:.72rem;color:var(--muted);font-weight:500;margin-top:1px}
.cat button{font:inherit;font-size:.9rem;border:1.5px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.cat button.in{border-style:solid;border-color:var(--ok);color:var(--ok)}
.lines{list-style:none;margin:12px 0 0;padding:0;border-top:1.5px solid var(--line)}
.lines li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lines .name{flex:1;font-weight:600}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:40px;height:40px;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:1.25rem;font-weight:700;cursor:pointer}
.step input{width:48px;border:0;text-align:center;font:inherit;font-weight:700;background:transparent;color:var(--ink);padding:0;min-height:40px}
.empty{color:var(--muted);font-size:.9rem;padding:12px 0}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow button{flex:none}
.addrow[hidden]{display:none}
@media (max-width:400px){.sync{max-width:80px;font-size:.68rem}}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 14px;cursor:pointer;min-height:46px}
.btn.primary{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* Etiqueta de vista previa */
.label{position:relative;background:var(--surface);border:2px solid var(--brand);border-radius:6px;padding:14px 16px 16px;margin-top:6px}
.label::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#164B77 0 40%,#2981C4 40% 75%,#66C0DC 75%);border-radius:3px 3px 0 0}
.label h3{margin:6px 0 2px;font-weight:700;font-size:1.3rem;line-height:1.2;text-transform:uppercase}
.label .code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.label .dest{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:4px;font-weight:700;font-size:1rem;background:var(--brand);color:#fff}
.label .dest.lima{background:#2981C4;color:#fff}
.label dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font-size:.92rem}
.label dt{color:var(--muted)}
.label dd{margin:0;font-weight:600}
.label ul{margin:10px 0 0;padding-left:18px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1.5px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.dock .primary{flex:1;font-size:1.05rem}
.missing{font-size:.8rem;color:var(--warn);max-width:640px;margin:0 auto 6px}
/* Registro */
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters select{width:auto;flex:1;min-width:140px}
.order{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.order .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.order .top b{font-size:1.05rem}
.order .top span{color:var(--muted);font-size:.82rem}
.order .meta{font-size:.9rem;margin-top:4px}
.order .items{font-size:.88rem;color:var(--muted);margin-top:4px}
.states{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.states button{font:inherit;font-size:.82rem;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 10px;cursor:pointer}
.states button.done{background:var(--ok);border-color:var(--ok);color:#fff}
.order .acts{display:flex;gap:8px;margin-top:10px}
.order .acts .btn{min-height:38px;padding:7px 12px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.gate{position:fixed;inset:0;z-index:50;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden]{display:none}
.gate .box{width:100%;max-width:340px;text-align:center}
.gate .logo{height:56px;margin:0 auto 18px}
.gate h1{font-size:1.15rem;font-weight:600;margin:0 0 4px}
.gate p{font-size:.88rem;color:#A9D8E8;margin:0 0 18px}
.gate input{text-align:center;font-size:1.4rem;letter-spacing:.3em;background:#fff;color:#0F3456;border:0}
.gate .btn{width:100%;margin-top:12px;background:#66C0DC;border-color:#66C0DC;color:#0F3456}
.gate .err{color:#FFD2D2;min-height:1.3em;font-size:.85rem;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

    <button role="tab" id="t-nueva" aria-selected="true" aria-controls="v-nueva">Nueva orden</button>

</header>

<main>
<section class="view" id="v-nueva" role="tabpanel" aria-labelledby="t-nueva">
  <fieldset>
    <legend>Vendedor</legend>
    <input type="text" id="vendedor" placeholder="Tu nombre (se guarda en este celular)" autocomplete="name">
  </fieldset>

  <fieldset>
    <legend>Destino</legend>
    <div class="seg" id="destino">
      <button type="button" data-v="Lima" aria-pressed="true">Lima</button>
      <button type="button" data-v="Provincia" aria-pressed="false">Provincia</button>
    </div>
    <div id="box-lima">
      <label class="f">Tipo de entrega</label>
      <div class="chips" id="entrega"></div>
      <label class="f" for="direccion">Dirección o distrito</label>
      <input type="text" id="direccion" placeholder="Ej.: Av. Brasil 1234, Jesús María">
    </div>
    <div id="box-prov" hidden>
      <div class="row2">
        <div><label class="f" for="ciudad">Ciudad</label><input type="text" id="ciudad" placeholder="Ej.: Arequipa"></div>
        <div><label class="f" for="sede">Sede / agencia destino</label><input type="text" id="sede" placeholder="Opcional"></div>
      </div>
      <label class="f">Agencia de envío</label>
      <div class="chips" id="agencia"></div>
      <input type="text" id="agencia-otra" placeholder="Nombre de la agencia" hidden style="margin-top:8px">
    </div>
    <label class="f">Embalaje</label>
    <div class="seg" id="embalaje">
      <button type="button" data-v="Sin embalaje" aria-pressed="true">Sin embalaje</button>
      <button type="button" data-v="Con embalaje" aria-pressed="false">Con embalaje</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Cliente</legend>
    <label class="f" for="cliente">Nombre y apellido o razón social</label>
    <input type="text" id="cliente" placeholder="Ej.: Juan Pérez Rojas">
    <div class="row2">
      <div><label class="f" for="doc">DNI o RUC</label><input type="tel" id="doc" inputmode="numeric" maxlength="11" placeholder="8 u 11 dígitos"><div class="hint" id="doc-hint"></div></div>
      <div><label class="f" for="tel">Teléfono</label><input type="tel" id="tel" inputmode="tel" placeholder="9 dígitos"></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Productos a alistar</legend>
    <input type="search" id="buscar" placeholder="Buscar por nombre o SKU">
    <div class="chips" id="cats"></div>
    <div class="cat" id="catalogo"></div>
    <div class="addrow" id="addrow" hidden>
      <button type="button" class="btn sun" id="agregar-nuevo">Agregar al catálogo</button>
    </div>
    <ul class="lines" id="lineas"></ul>
  </fieldset>

  <fieldset>
    <legend>Pago y notas</legend>
    <div class="chips" id="pago"></div>
    <label class="f" for="obs">Observaciones</label>
    <textarea id="obs" placeholder="Ej.: entregar antes de las 4 p. m., frágil, factura a nombre de…"></textarea>
  </fieldset>

  <fieldset>
    <legend>Así lo verá almacén</legend>
    <div class="label" id="preview" aria-live="polite"></div>
  </fieldset>
</section>

<section class="view" id="v-reg" role="tabpanel" aria-labelledby="t-reg" hidden>
  <div class="filters">
    <select id="f-estado" aria-label="Filtrar por estado">
      <option value="">Todos los estados</option>
      <option>Pendiente</option><option>Alistado</option><option>Embalado</option><option>Despachado</option>
    </select>
    <select id="f-dest" aria-label="Filtrar por destino">
      <option value="">Lima y provincia</option><option>Lima</option><option>Provincia</option>
    </select>
    <button class="btn" id="actualizar" type="button">Actualizar</button>
  </div>
  <div id="lista"></div>
</section>
</main>

<div class="dock" id="dock">
  <div class="missing" id="missing"></div>
  <div class="in">
    <button class="btn" type="button" id="copiar">Copiar</button>
    <button class="btn primary" type="button" id="enviar">Enviar a WhatsApp</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden>

const S = { destino:"Lima", entrega:"Recojo en tienda", agencia:"Shalom", embalaje:"Sin embalaje", pago:"Cancelado", lineas:[] };
let ordenes = [];

$("#vendedor").value = LS.get("tl_vendedor","");

/* ---------- helpers ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function fecha(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function nuevoCodigo(){const d=new Date();return "TL-"+pad(d.getDate())+pad(d.getMonth()+1)+"-"+pad(d.getHours())+pad(d.getMinutes())+Math.random().toString(36).slice(2,4).toUpperCase()}
let codigo = nuevoCodigo();

function chips(el,opts,key){
  el.innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o;b.setAttribute("aria-pressed",S[key]===o);
    b.onclick=()=>{S[key]=o;chips(el,opts,key);sync()};el.appendChild(b)});
}
function seg(el,key,after){
  el.querySelectorAll("button").forEach(b=>{b.onclick=()=>{S[key]=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));after&&after();sync()}});
}
function setSeg(el,val){el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===val))}

chips($("#entrega"),ENTREGAS,"entrega");
chips($("#agencia"),AGENCIAS,"agencia");
chips($("#pago"),PAGOS,"pago");
seg($("#destino"),"destino",()=>{
  const prov=S.destino==="Provincia";$("#box-prov").hidden=!prov;$("#box-lima").hidden=prov;
  S.embalaje = prov ? "Con embalaje" : "Sin embalaje"; setSeg($("#embalaje"),S.embalaje);
});
seg($("#embalaje"),"embalaje");

/* ---------- catálogo y líneas ---------- */
function renderCats(){
  const el=$("#cats");el.innerHTML="";
  ["Todos",...new Set(catalogo.map(p=>p.c))].forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c;
    const val=c==="Todos"?"":c;b.setAttribute("aria-pressed",catSel===val);b.onclick=()=>{catSel=val;renderCats();renderCat()};el.appendChild(b)});
}
function renderCat(){
  const raw=$("#buscar").value.trim(),q=raw.toLowerCase();
  const el=$("#catalogo");el.innerHTML="";
  const list=catalogo.filter(p=>(!catSel||p.c===catSel)&&(!q||(p.n+" "+p.s).toLowerCase().includes(q)));
  if(!list.length)el.innerHTML='<span class="empty">No hay productos con ese nombre o SKU.</span>';
  list.forEach(p=>{const b=document.createElement("button");b.type="button";
    const ln=S.lineas.find(l=>key(l)===key(p));b.className=ln?"in":"";
    b.innerHTML=(ln?"✓ "+ln.q+" × ":"+ ")+esc(p.n)+(p.s?'<small>'+esc(p.s)+'</small>':'');
    b.onclick=()=>addLinea(p);el.appendChild(b)});
  const exacto=catalogo.some(p=>p.n.toLowerCase()===q||(p.s&&p.s.toLowerCase()===q));
  $("#addrow").hidden=!q||exacto;
  if(q&&!exacto)$("#agregar-nuevo").textContent="Agregar “"+raw+"”";
}
function addLinea(p){const ln=S.lineas.find(l=>key(l)===key(p));if(ln)ln.q++;else S.lineas.push({p:p.n,n:p.n,s:p.s||"",q:1});renderLineas();sync()}
function renderLineas(){
  const el=$("#lineas");el.innerHTML="";
  if(!S.lineas.length){el.innerHTML='<li class="empty">Toca un producto de la lista para agregarlo.</li>'}
  S.lineas.forEach((l,i)=>{
    const li=document.createElement("li");
    li.innerHTML='<span class="name">'+esc(l.p)+(l.s?'<small class="sku">'+esc(l.s)+'</small>':'')+'</span><div class="step"><button type="button" aria-label="Quitar uno">−</button><input type="tel" inputmode="numeric" aria-label="Cantidad" value="'+l.q+'"><button type="button" aria-label="Agregar uno">+</button></div>';
    const [m,inp,p]=[li.querySelector("button"),li.querySelector("input"),li.querySelectorAll("button")[1]];
    m.onclick=()=>{l.q--;if(l.q<=0)S.lineas.splice(i,1);renderLineas();sync()};
    p.onclick=()=>{l.q++;renderLineas();sync()};
    inp.onchange=()=>{const n=parseInt(inp.value,10);if(!n||n<=0)S.lineas.splice(i,1);else l.q=n;renderLineas();sync()};
    el.appendChild(li)});
  renderCat();
}
$("#buscar").addEventListener("input",renderCat);
$("#agregar-nuevo").onclick=()=>{const v=$("#buscar").value.trim();if(!v)return;const p={n:v,s:"",c:"Otros"};const extra=LS.get(EXTRA_KEY,[]);extra.push(p);LS.set(EXTRA_KEY,extra);catalogo.push(p);$("#buscar").value="";renderCats();addLinea(p);toast("Producto agregado en este celular")};

/* ---------- datos de la orden ---------- */
function v(id){return $(id).value.trim()}
function tipoDoc(d){return d.length===11?"RUC":d.length===8?"DNI":"DNI/RUC"}
function datos(){
  const prov=S.destino==="Provincia";
  const agencia=prov?(S.agencia==="Otra"?v("#agencia-otra"):S.agencia):"";
  return {codigo,fecha:fecha(new Date()),creado:Date.now(),vendedor:v("#vendedor"),destino:S.destino,
    entrega:prov?"Agencia":S.entrega,direccion:prov?"":v("#direccion"),ciudad:prov?v("#ciudad"):"Lima",sede:prov?v("#sede"):"",agencia,
    embalaje:S.embalaje,cliente:v("#cliente"),doc:v("#doc"),tipoDoc:tipoDoc(v("#doc")),tel:v("#tel"),
    productos:S.lineas.map(l=>({p:l.p,s:l.s||"",q:l.q})),pago:S.pago,obs:v("#obs"),estado:"Pendiente"};
}
function faltantes(o){
  const f=[];if(!o.vendedor)f.push("vendedor");if(!o.cliente)f.push("cliente");if(!o.productos.length)f.push("productos");
  if(o.destino==="Provincia"){if(!o.ciudad)f.push("ciudad");if(!o.agencia)f.push("agencia")}
  return f;
}
function mensaje(o){
  const L=[];
  L.push("📦 *ORDEN DE DESPACHO – TRANSLINE*");
  L.push("🔢 "+o.codigo);
  L.push("🗓️ "+o.fecha+"  |  👤 "+(o.vendedor||"—"));
  L.push("");
  L.push("📍 *"+o.destino.toUpperCase()+"*"+(o.destino==="Provincia"?" – "+(o.ciudad||"—"):""));
  if(o.destino==="Provincia"){L.push("🚚 *Agencia:* "+(o.agencia||"—")+(o.sede?" ("+o.sede+")":""))}
  else{L.push("🚚 *Entrega:* "+o.entrega+(o.direccion?" – "+o.direccion:""))}
  L.push("🎁 *"+o.embalaje.toUpperCase()+"*");
  L.push("");
  L.push("🧑 *Cliente:* "+(o.cliente||"—"));
  if(o.doc)L.push("🪪 *"+o.tipoDoc+":* "+o.doc);
  if(o.tel)L.push("📞 *Tel.:* "+o.tel);
  L.push("");
  L.push("🛒 *Productos:*");
  if(o.productos.length)o.productos.forEach(x=>L.push("• "+x.q+" × "+x.p+(x.s?" ("+x.s+")":"")));else L.push("• —");
  L.push("");
  L.push("💰 *Pago:* "+o.pago);
  if(o.obs)L.push("📝 *Obs.:* "+o.obs);
  return L.join("\n");
}
function renderPreview(o){
  const prov=o.destino==="Provincia";
  $("#preview").innerHTML=
    '<span class="code">'+esc(o.codigo)+' · '+esc(o.fecha)+'</span>'+
    '<h3>'+esc(o.cliente||"Nombre del cliente")+'</h3>'+
    '<span class="dest '+(prov?"":"lima")+'">'+(prov?"PROVINCIA · "+esc((o.ciudad||"Ciudad").toUpperCase()):"LIMA")+'</span>'+
    '<dl>'+
      (o.doc?'<dt>'+o.tipoDoc+'</dt><dd>'+esc(o.doc)+'</dd>':'')+
      (o.tel?'<dt>Teléfono</dt><dd>'+esc(o.tel)+'</dd>':'')+
      (prov?'<dt>Agencia</dt><dd>'+esc(o.agencia||"—")+(o.sede?" · "+esc(o.sede):"")+'</dd>':'<dt>Entrega</dt><dd>'+esc(o.entrega)+(o.direccion?" · "+esc(o.direccion):"")+'</dd>')+
      '<dt>Embalaje</dt><dd>'+esc(o.embalaje)+'</dd>'+
      '<dt>Pago</dt><dd>'+esc(o.pago)+'</dd>'+
      '<dt>Vendedor</dt><dd>'+esc(o.vendedor||"—")+'</dd>'+
    '</dl>'+
    (o.productos.length?'<ul>'+o.productos.map(x=>'<li><b>'+x.q+' ×</b> '+esc(x.p)+(x.s?' <span class="code">'+esc(x.s)+'</span>':'')+'</li>').join("")+'</ul>':'')+
    (o.obs?'<p style="margin:10px 0 0;font-size:.9rem"><b>Obs.:</b> '+esc(o.obs)+'</p>':'');
}
function sync(){
  const o=datos();renderPreview(o);
  const f=faltantes(o);
  $("#missing").textContent=f.length?"Falta: "+f.join(", "):"";
  $("#enviar").disabled=!!f.length;$("#copiar").disabled=!!f.length;
}
["#vendedor","#cliente","#doc","#tel","#ciudad","#sede","#direccion","#obs","#agencia-otra"].forEach(id=>$(id).addEventListener("input",()=>{
  if(id==="#vendedor")LS.set("tl_vendedor",v("#vendedor"));
  if(id==="#doc"){const d=$("#doc").value.replace(/\D/g,"");$("#doc").value=d;$("#doc-hint").textContent=d.length===8?"DNI":d.length===11?"RUC":d?"Se esperan 8 (DNI) u 11 (RUC) dígitos":""}
  sync()}));
$("#agencia").addEventListener("click",()=>{$("#agencia-otra").hidden=S.agencia!=="Otra"});

/* ---------- registro en Google Sheets ---------- */
let PIN = LS.get("tl_pin","");
let cola = LS.get("tl_cola",[]);
const conectado = () => /^https:\/\/script\.google\.com\//.test(API_URL);
function estadoSync(t){$("#sync").textContent=t}
async function api(body){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pin:PIN},body))});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
async function cargar(silencioso){
  if(!conectado()){estadoSync("Falta conectar la hoja");return}
  try{
    const r=await fetch(API_URL+"?action=list&pin="+encodeURIComponent(PIN));
    const j=await r.json();
    if(!j.ok){ if(j.error==="pin"){pedirPin("El PIN cambió. Ingrésalo de nuevo.")} return }
    const pendientes=cola.map(x=>x.orden).filter(Boolean);
    ordenes=pendientes.concat(j.ordenes.filter(o=>!pendientes.some(p=>p.codigo===o.codigo)));
    LS.set("tl_ordenes",ordenes); renderLista();
    if(j.productos&&j.productos.length){ catalogo=j.productos.concat(LS.get(EXTRA_KEY,[])); LS.set("tl_catalogo",j.productos); renderCats(); renderCat(); }
    estadoSync(cola.length?"Enviando "+cola.length+"…":"Conectado ✓");
  }catch(e){ estadoSync("Sin conexión"); if(!silencioso) toast("Sin conexión. Se usará lo último guardado.") }
}
async function vaciarCola(){
  if(!conectado()||!cola.length) return;
  while(cola.length){
    try{ await api(cola[0]); cola.shift(); LS.set("tl_cola",cola); }
    catch(e){ estadoSync("Pendiente: "+cola.length+" sin enviar"); return }
  }
  estadoSync("Conectado ✓");
}
async function guardar(o){
  ordenes=[o,...ordenes.filter(x=>x.codigo!==o.codigo)]; LS.set("tl_ordenes",ordenes); renderLista();
  cola.push({action:"crear",orden:o}); LS.set("tl_cola",cola); await vaciarCola();
}
async function cambiarEstado(o,estado){
  o.estado=estado; LS.set("tl_ordenes",ordenes); renderLista();
  cola.push({action:"estado",codigo:o.codigo,estado}); LS.set("tl_cola",cola); await vaciarCola();
}
function renderLista(){
  const fe=$("#f-estado").value,fd=$("#f-dest").value;
  const list=ordenes.filter(o=>(!fe||o.estado===fe)&&(!fd||o.destino===fd));
  $("#pend").textContent=ordenes.filter(o=>o.estado!=="Despachado").length;
  const el=$("#lista");
  if(!list.length){el.innerHTML='<p class="empty">'+(ordenes.length?"Ninguna orden con ese filtro.":"Aún no hay órdenes. Crea la primera en la pestaña Nueva orden.")+'</p>';return}
  el.innerHTML="";
  list.forEach(o=>{
    const d=document.createElement("div");d.className="order";
    const idx=ESTADOS.indexOf(o.estado);
    d.innerHTML='<div class="top"><b>'+esc(o.cliente)+'</b><span>'+esc(o.codigo)+' · '+esc(o.fecha)+' · '+esc(o.vendedor)+'</span></div>'+
      '<div class="meta">'+(o.destino==="Provincia"?"Provincia · "+esc(o.ciudad)+" · "+esc(o.agencia):"Lima · "+esc(o.entrega))+' · '+esc(o.embalaje)+'</div>'+
      '<div class="items">'+o.productos.map(x=>x.q+" × "+esc(x.p)+(x.s?" ("+esc(x.s)+")":"")).join(", ")+'</div>'+
      '<div class="states">'+ESTADOS.map((s,i)=>'<button type="button" data-s="'+s+'" class="'+(i<=idx?"done":"")+'">'+s+'</button>').join("")+'</div>'+
      '<div class="acts"><button type="button" class="btn" data-a="reenviar">Reenviar a WhatsApp</button></div>';
    d.querySelectorAll(".states button").forEach(b=>b.onclick=()=>cambiarEstado(o,b.dataset.s));
    d.querySelector('[data-a="reenviar"]').onclick=()=>abrirWA(mensaje(o)+"\n\n✅ *Estado:* "+o.estado);
    el.appendChild(d)});
}
$("#f-estado").onchange=renderLista;$("#f-dest").onchange=renderLista;

$("#actualizar").onclick=()=>{vaciarCola().then(()=>cargar())};

/* ---------- WhatsApp y copiar ---------- */
function abrirWA(txt){
  const a=document.createElement("a");a.href="https://wa.me/?text="+encodeURIComponent(txt);a.target="_blank";a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();
}
async function copiar(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){
    const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
}
function limpiar(){
  ["#cliente","#doc","#tel","#ciudad","#sede","#direccion","#obs","#agencia-otra","#buscar"].forEach(id=>$(id).value="");
  $("#doc-hint").textContent="";S.lineas=[];S.pago="Cancelado";chips($("#pago"),PAGOS,"pago");codigo=nuevoCodigo();renderLineas();sync();window.scrollTo(0,0);
}
$("#enviar").onclick=async()=>{const o=datos();if(faltantes(o).length)return;abrirWA(mensaje(o));await guardar(o);toast("Orden "+o.codigo+" registrada");limpiar()};
$("#copiar").onclick=async()=>{const o=datos();if(faltantes(o).length)return;const ok=await copiar(mensaje(o));await guardar(o);toast(ok?"Copiado y registrado. Pégalo en el grupo.":"Registrado. No se pudo copiar.");limpiar()};

/* ---------- pestañas ---------- */
function tab(n){const reg=n==="reg";$("#t-nueva").setAttribute("aria-selected",!reg);$("#t-reg").setAttribute("aria-selected",reg);
  $("#v-nueva").hidden=reg;$("#v-reg").hidden=!reg;$("#dock").hidden=reg;window.scrollTo(0,0)}
$("#t-nueva").onclick=()=>tab("nueva");$("#t-reg").onclick=()=>tab("reg");
if(location.hash==="#registro")tab("reg");

/* ---------- PIN ---------- */
function pedirPin(msg){ $("#gate").hidden=false; $("#pin-err").textContent=msg||""; setTimeout(()=>$("#pin").focus(),50) }
async function validarPin(){
  const v=$("#pin").value.trim(); if(!v) return;
  $("#pin-ok").disabled=true; $("#pin-err").textContent="Verificando…";
  try{
    const r=await fetch(API_URL+"?action=list&pin="+encodeURIComponent(v)); const j=await r.json();
    if(j.ok){ PIN=v; LS.set("tl_pin",v); $("#gate").hidden=true; $("#pin").value=""; await vaciarCola(); await cargar(); }
    else $("#pin-err").textContent="PIN incorrecto";
  }catch(e){ $("#pin-err").textContent="Sin conexión. Revisa tu internet." }
  $("#pin-ok").disabled=false;
}
$("#pin-ok").onclick=validarPin;
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")validarPin()});

/* ---------- arranque ---------- */
const catGuardado=LS.get("tl_catalogo",null);
if(catGuardado&&catGuardado.length) catalogo=catGuardado.concat(LS.get(EXTRA_KEY,[]));
renderCats();renderLineas();sync();
ordenes=LS.get("tl_ordenes",[]);renderLista();
if(!conectado()) estadoSync("Falta conectar la hoja");
else if(!PIN) pedirPin();
else { vaciarCola().then(()=>cargar(true)); }
setInterval(()=>{ if(document.visibilityState==="visible"&&PIN&&conectado()) vaciarCola().then(()=>cargar(true)) },30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&PIN&&conectado()) cargar(true) });
window.addEventListener("online",()=>vaciarCola());
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}) }
})();
</script>
</body>
</html>
